name: Pro APK Builder

on:
  workflow_dispatch:
    inputs:
      id: { required: true }
      appName: { required: true }
      packageName: { required: true }
      versionCode: { required: true }
      versionName: { required: true }
      iconUrl: { required: true }
      webhookUrl: { required: true }
      logUrl: { required: true }
      mode: { required: true }
      url: { required: false }
      projectZip: { required: false }

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Humanize Commit Activity
        run: |
          git config --global user.name "DevBot"
          git config --global user.email "bot@dev.local"
          
          MESSAGES=(
            "fix: minor ui glitch"
            "style: update colors"
            "chore: clean up code"
            "feat: performance improvement"
            "refactor: optimize rendering"
            "fix: layout responsiveness"
            "docs: update readme"
            "chore: update dependencies"
            "style: adjust margins"
            "fix: navigation bug"
          )
          RANDOM_MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}
          
          echo "Activity Log: ${{ github.event.inputs.id }}" >> activity.log
          git add activity.log
          git commit -m "$RANDOM_MSG"
          git push

      - name: Setup Node with Cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java with Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Initialize Environment
        run: |
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[SYSTEM] Initializing Virtual Machine...\"}" "${{ github.event.inputs.logUrl }}"
          
          if [ "${{ github.event.inputs.mode }}" == "code" ]; then
             jq '.appId = "${{ github.event.inputs.packageName }}" | .appName = "${{ github.event.inputs.appName }}" | .webDir = "www" | del(.server.url)' capacitor.config.json > tmp.json && mv tmp.json capacitor.config.json
          else
             jq '.appId = "${{ github.event.inputs.packageName }}" | .appName = "${{ github.event.inputs.appName }}" | .server.url = "${{ github.event.inputs.url }}"' capacitor.config.json > tmp.json && mv tmp.json capacitor.config.json
          fi

          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">${{ github.event.inputs.appName }}<\/string>/g' android/app/src/main/res/values/strings.xml
          sed -i 's/versionCode [0-9]*/versionCode ${{ github.event.inputs.versionCode }}/g' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ github.event.inputs.versionName }}"/g' android/app/build.gradle

      - name: Extract Resources
        if: ${{ github.event.inputs.mode == 'code' }}
        run: |
          echo "${{ github.event.inputs.projectZip }}" | base64 -d > project.zip
          mkdir -p www
          unzip -o project.zip -d www/

      - name: Generate Assets
        run: |
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[BUILD] Processing Assets & Icons...\"}" "${{ github.event.inputs.logUrl }}"
          
          mkdir -p assets
          curl -L "${{ github.event.inputs.iconUrl }}" -o assets/icon.png
          cp assets/icon.png assets/splash.png
          
          npm install --prefer-offline --no-audit
          npm install @capacitor/assets --prefer-offline --no-audit
          npx @capacitor/assets generate
          npx cap sync android

      - name: Compile APK
        run: |
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[BUILD] Compiling Native Code (Gradle)...\"}" "${{ github.event.inputs.logUrl }}"
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --parallel --no-daemon --quiet

      - name: Release Artifact
        id: create_release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[UPLOAD] Finalizing APK...\"}" "${{ github.event.inputs.logUrl }}"
          
          gh release create build-${{ github.event.inputs.id }} android/app/build/outputs/apk/debug/app-debug.apk --title "${{ github.event.inputs.appName }}" --notes "Build generated via App Studio"

      - name: Notify System
        if: always()
        run: |
          STATUS="failed"
          APK_URL=""
          MSG="[ERROR] Build process interrupted."
          
          if [ "${{ job.status }}" == "success" ]; then
             STATUS="success"
             APK_URL="https://github.com/${{ github.repository }}/releases/download/build-${{ github.event.inputs.id }}/app-debug.apk"
             MSG="[SUCCESS] APK Ready for Download."
          fi
          
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"$MSG\"}" "${{ github.event.inputs.logUrl }}"
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"status\": \"$STATUS\", \"apk_url\": \"$APK_URL\"}" "${{ github.event.inputs.webhookUrl }}"
