name: Pro APK Builder

on:
  workflow_dispatch:
    inputs:
      id: { required: true }
      appName: { required: true }
      packageName: { required: true }
      versionCode: { required: true }
      versionName: { required: true }
      iconUrl: { required: true }
      webhookUrl: { required: true }
      logUrl: { required: true }
      mode: { required: true }
      url: { required: false }
      projectZip: { required: false }

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Security Audit & Log
        run: |
          git config --global user.name "Builder Bot"
          git config --global user.email "bot@builder.local"
          echo "Build ID: ${{ github.event.inputs.id }} | Date: $(date)" >> build_history.log
          git add build_history.log
          git commit -m "chore: activity log"
          git push

      # PERBAIKAN UTAMA: Menggunakan Node versi 22
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '21', cache: 'gradle' }

      - name: Configure Project
        run: |
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[CONFIG] Setting up environment (Node 22)...\"}" "${{ github.event.inputs.logUrl }}"
          
          if [ "${{ github.event.inputs.mode }}" == "code" ]; then
             jq '.appId = "${{ github.event.inputs.packageName }}" | .appName = "${{ github.event.inputs.appName }}" | .webDir = "www" | del(.server.url)' capacitor.config.json > tmp.json && mv tmp.json capacitor.config.json
          else
             jq '.appId = "${{ github.event.inputs.packageName }}" | .appName = "${{ github.event.inputs.appName }}" | .server.url = "${{ github.event.inputs.url }}"' capacitor.config.json > tmp.json && mv tmp.json capacitor.config.json
          fi

          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">${{ github.event.inputs.appName }}<\/string>/g' android/app/src/main/res/values/strings.xml
          sed -i 's/versionCode [0-9]*/versionCode ${{ github.event.inputs.versionCode }}/g' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ github.event.inputs.versionName }}"/g' android/app/build.gradle

      - name: Extract Project Files
        if: ${{ github.event.inputs.mode == 'code' }}
        run: |
          echo "${{ github.event.inputs.projectZip }}" | base64 -d > project.zip
          mkdir -p www
          unzip -o project.zip -d www/

      - name: Generate Assets & Build
        run: |
          mkdir -p assets
          curl -L "${{ github.event.inputs.iconUrl }}" -o assets/icon.png
          cp assets/icon.png assets/splash.png
          npm install
          npm install @capacitor/assets
          npx @capacitor/assets generate
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --parallel --no-daemon --quiet

      - name: Upload & Notify
        if: always()
        run: |
          STATUS="failed"
          URL=""
          if [ "${{ job.status }}" == "success" ]; then
             STATUS="success"
             URL="https://github.com/${{ github.repository }}/releases/download/build-${{ github.event.inputs.id }}/app-debug.apk"
          fi
          if [ "$STATUS" == "success" ]; then
             gh release create build-${{ github.event.inputs.id }} android/app/build/outputs/apk/debug/app-debug.apk --title "${{ github.event.inputs.appName }}" --notes "Auto build"
             env:
               GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          fi
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"status\": \"$STATUS\", \"apk_url\": \"$URL\"}" "${{ github.event.inputs.webhookUrl }}"
