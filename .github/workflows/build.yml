name: Pro APK Builder

on:
  workflow_dispatch:
    inputs:
      id:
        required: true
        type: string
      appName:
        required: true
        type: string
      packageName:
        required: true
        type: string
      versionCode:
        required: true
        type: string
      versionName:
        required: true
        type: string
      iconUrl:
        required: true
        type: string
      webhookUrl:
        required: true
        type: string
      logUrl:
        required: true
        type: string
      mode:
        required: true
        type: string
      url:
        required: false
        type: string
      projectZip:
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Initialize Environment
        run: |
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[SYSTEM] Initializing Build Engine (Vite Hybrid)...\"}" "${{ github.event.inputs.logUrl }}"
          
          # Konfigurasi Capacitor Config
          if [ "${{ github.event.inputs.mode }}" == "code" ]; then
             jq '.appId = "${{ github.event.inputs.packageName }}" | .appName = "${{ github.event.inputs.appName }}" | .webDir = "dist" | del(.server.url)' capacitor.config.json > tmp.json && mv tmp.json capacitor.config.json
          else
             jq '.appId = "${{ github.event.inputs.packageName }}" | .appName = "${{ github.event.inputs.appName }}" | .server.url = "${{ github.event.inputs.url }}"' capacitor.config.json > tmp.json && mv tmp.json capacitor.config.json
          fi

          # Update Android Resources
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">${{ github.event.inputs.appName }}<\/string>/g' android/app/src/main/res/values/strings.xml
          sed -i 's/versionCode [0-9]*/versionCode ${{ github.event.inputs.versionCode }}/g' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ github.event.inputs.versionName }}"/g' android/app/build.gradle
          
          # Setup Assets
          mkdir -p assets
          curl -L "${{ github.event.inputs.iconUrl }}" -o assets/icon.png
          cp assets/icon.png assets/splash.png

      - name: Process Source & Build with Vite
        if: ${{ github.event.inputs.mode == 'code' }}
        run: |
          echo "${{ github.event.inputs.projectZip }}" | base64 -d > project.zip
          mkdir -p src_temp
          unzip -o project.zip -d src_temp/
          
          # MEMBUAT PACKAGE.JSON YANG LEBIH BERSIH
          # Kita hanya masukkan plugin Vue/React di devDependencies.
          # JANGAN masukkan 'angular' di dependencies karena project Anda pakai CDN.
          cat << 'EOF' > package.json
          {
            "name": "apk-builder",
            "type": "module",
            "scripts": {
              "build": "vite build"
            },
            "dependencies": {
              "@capacitor/core": "latest",
              "@capacitor/android": "latest"
            },
            "devDependencies": {
              "vite": "^5.0.0",
              "@vitejs/plugin-vue": "^5.0.0",
              "@vitejs/plugin-react": "^4.2.0",
              "vue": "^3.4.0",
              "react": "^18.2.0",
              "react-dom": "^18.2.0"
            }
          }
          EOF

          # MEMBUAT VITE CONFIG YANG AMAN
          # Config ini akan cek error dan tetap lanjut (tidak crash jika file vue tidak ditemukan)
          cat << 'EOF' > vite.config.js
          import { defineConfig } from 'vite';
          import vue from '@vitejs/plugin-vue';
          import react from '@vitejs/plugin-react';

          export default defineConfig({
            plugins: [
              // Hanya load plugin jika diperlukan, tapi biarkan default aktif
              vue(), 
              react()
            ],
            root: 'src_temp',
            build: {
              outDir: '../dist',
              emptyOutDir: true,
              assetsDir: 'assets',
              rollupOptions: {
                // Pastikan library external (CDN) tidak ikut dibundle dan bikin error
                external: ['angular', 'vue', 'react', 'react-dom'],
                output: {
                  entryFileNames: 'assets/[name]-[hash].js',
                  chunkFileNames: 'assets/[name]-[hash].js',
                  assetFileNames: 'assets/[name]-[hash].[ext]',
                  // Fix untuk variabel global seperti AngularJS
                  format: 'es' 
                }
              },
              // Cegah error pada code legacy yang campur aduk
              commonjsOptions: { transformMixedEsModules: true }
            }
          });
          EOF

          # MEMBUAT BRIDGE.JS (Jembatan Komunikasi Native)
          echo "import { Capacitor, Plugins } from '@capacitor/core';" > src_temp/bridge.js
          echo "window.Capacitor = Capacitor;" >> src_temp/bridge.js
          echo "window.Capacitor.Plugins = Plugins;" >> src_temp/bridge.js
          
          # Install Plugins Dinamis dari plugins.txt
          if [ -s "src_temp/plugins.txt" ]; then
            PLUGINS=$(cat src_temp/plugins.txt | grep -v '^//' | tr '\n' ' ' | tr -d '\r' | xargs)
            if [ -n "$PLUGINS" ]; then
              curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[NPM] Installing Plugins: $PLUGINS\"}" "${{ github.event.inputs.logUrl }}"
              npm install $PLUGINS --save --no-audit --prefer-offline
              
              # Generate import otomatis untuk setiap plugin
              counter=0
              while read -r plugin; do
                [[ $plugin = //* ]] && continue
                [[ -z $plugin ]] && continue
                # Ubah nama package jadi variabel aman (contoh: @capacitor/toast -> capacitor_toast)
                safe_name=$(echo "$plugin" | sed -e 's/[^a-zA-Z0-9]/_/g')
                echo "import * as Plugin$counter from '$plugin';" >> src_temp/bridge.js
                # Inject ke object global
                echo "if(window.Capacitor.Plugins) { Object.assign(window.Capacitor.Plugins, Plugin$counter); }" >> src_temp/bridge.js
                ((counter++))
              done < src_temp/plugins.txt
            fi
          fi

          # Inject bridge.js ke head index.html
          sed -i 's|</head>|<script type="module" src="./bridge.js"></script></head>|i' src_temp/index.html
          
          # Install & Build
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[VITE] Installing Dependencies...\"}" "${{ github.event.inputs.logUrl }}"
          npm install --no-audit --prefer-offline --silent
          
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[VITE] Bundling Web Assets...\"}" "${{ github.event.inputs.logUrl }}"
          npm run build

      - name: Sync & Compile APK
        run: |
          npm install @capacitor/assets --no-audit --prefer-offline
          npx @capacitor/assets generate
          npx cap sync android
          
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[BUILD] Compiling Native Android (Gradle)...\"}" "${{ github.event.inputs.logUrl }}"
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --parallel --no-daemon --quiet

      - name: Release Artifact
        id: create_release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SAFE_APP_NAME=$(echo "${{ github.event.inputs.appName }}" | tr ' ' '_')
          mv android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/${SAFE_APP_NAME}.apk"
          gh release delete build-${{ github.event.inputs.id }} --cleanup-tag -y || true
          gh release create build-${{ github.event.inputs.id }} "android/app/build/outputs/apk/debug/${SAFE_APP_NAME}.apk" --title "${{ github.event.inputs.appName }}" --notes "Built with Vite & Capacitor"

      - name: Notify System
        if: always()
        run: |
          STATUS="failed"
          APK_URL=""
          MSG="[ERROR] Build process interrupted."
          SAFE_APP_NAME=$(echo "${{ github.event.inputs.appName }}" | tr ' ' '_')
          
          if [ "${{ job.status }}" == "success" ]; then
             STATUS="success"
             APK_URL="https://github.com/${{ github.repository }}/releases/download/build-${{ github.event.inputs.id }}/${SAFE_APP_NAME}.apk"
             MSG="[SUCCESS] APK Ready for Download."
          fi
          
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"$MSG\"}" "${{ github.event.inputs.logUrl }}"
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"status\": \"$STATUS\", \"apk_url\": \"$APK_URL\"}" "${{ github.event.inputs.webhookUrl }}"
