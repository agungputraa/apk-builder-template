name: Pro APK Builder

on:
  workflow_dispatch:
    inputs:
      id:
        required: true
        type: string
      appName:
        required: true
        type: string
      packageName:
        required: true
        type: string
      versionCode:
        required: true
        type: string
      versionName:
        required: true
        type: string
      iconUrl:
        required: true
        type: string
      webhookUrl:
        required: true
        type: string
      logUrl:
        required: true
        type: string
      mode:
        required: true
        type: string
      url:
        required: false
        type: string
      projectZip:
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. GUNAKAN NODE 22 (Wajib untuk Capacitor 7)
      - name: Setup Node (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 2. GUNAKAN JAVA 21 (Standar baru Android Build)
      - name: Setup Java (v21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Initialize & Stabilize Dependencies
        run: |
          # Notify System
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[SYSTEM] Initializing & Fixing Environment...\"}" "${{ github.event.inputs.logUrl }}"
          
          # Setup Capacitor Config
          if [ "${{ github.event.inputs.mode }}" == "code" ]; then
             jq '.appId = "${{ github.event.inputs.packageName }}" | .appName = "${{ github.event.inputs.appName }}" | .webDir = "www" | del(.server.url)' capacitor.config.json > tmp.json && mv tmp.json capacitor.config.json
          else
             jq '.appId = "${{ github.event.inputs.packageName }}" | .appName = "${{ github.event.inputs.appName }}" | .server.url = "${{ github.event.inputs.url }}"' capacitor.config.json > tmp.json && mv tmp.json capacitor.config.json
          fi

          # Update Android App Info
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">${{ github.event.inputs.appName }}<\/string>/g' android/app/src/main/res/values/strings.xml
          sed -i 's/versionCode [0-9]*/versionCode ${{ github.event.inputs.versionCode }}/g' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ github.event.inputs.versionName }}"/g' android/app/build.gradle
          
          # ==================================================================================
          # 3. SUPER FIX: FORCE STABLE CONFIGURATION & KOTLIN VERSION
          # ==================================================================================
          echo "Stabilizing Android Project..."
          
          # Force SDK 35 (Android 15 Stable)
          sed -i "s/compileSdkVersion = .*/compileSdkVersion = 35/" android/variables.gradle
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = 35/" android/variables.gradle
          
          # Downgrade libraries to stable compatible versions
          sed -i "s/androidxActivityVersion = .*/androidxActivityVersion = '1.9.3'/" android/variables.gradle
          sed -i "s/androidxAppCompatVersion = .*/androidxAppCompatVersion = '1.7.0'/" android/variables.gradle
          sed -i "s/androidxCoreVersion = .*/androidxCoreVersion = '1.15.0'/" android/variables.gradle
          sed -i "s/coreSplashScreenVersion = .*/coreSplashScreenVersion = '1.0.1'/" android/variables.gradle
          sed -i "s/androidxWebkitVersion = .*/androidxWebkitVersion = '1.12.1'/" android/variables.gradle
          
          # Upgrade AGP to 8.7.3 (Compatible with Java 21)
          sed -i "s/gradle:8.13.0/gradle:8.7.3/" android/build.gradle
          sed -i "s/gradle:8.2.1/gradle:8.7.3/" android/build.gradle
          
          # Upgrade Gradle Wrapper
          sed -i 's/distributionUrl=.*/distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-8.11.1-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
          
          # --- ANTI-DUPLICATE CLASS FIX ---
          # Inject Resolution Strategy to force consistent Kotlin Version
          cat <<EOF >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      eachDependency { details ->
                          if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                              details.useVersion '1.9.22'
                          }
                      }
                  }
              }
          }
          EOF
          
          # Setup Icons
          mkdir -p assets
          curl -L "${{ github.event.inputs.iconUrl }}" -o assets/icon.png
          cp assets/icon.png assets/splash.png

      - name: Prepare Source & Build Bridge
        if: ${{ github.event.inputs.mode == 'code' }}
        run: |
          set -e
          
          echo ">>> Extracting Project..."
          echo "${{ github.event.inputs.projectZip }}" | base64 -d > project.zip
          mkdir -p www
          unzip -o project.zip -d www/
          
          echo ">>> Setting up Build Environment..."
          mkdir -p build_env
          cd build_env
          
          # Create minimal package.json
          echo '{"name": "native-builder","type":"module","dependencies":{"@capacitor/core":"latest","@capacitor/android":"latest","esbuild":"latest"}}' > package.json
          
          npm install
          
          echo ">>> Generating Bridge Script..."
          
          cat << 'EOF' > generate_bridge.js
          import fs from 'fs';
          import { execSync } from 'child_process';

          let bridgeContent = `
          import { Capacitor } from '@capacitor/core';
          window.Capacitor = Capacitor;
          window.Capacitor.Plugins = window.Capacitor.Plugins || {};
          `;

          try {
            if (fs.existsSync('../www/plugins.txt')) {
                const data = fs.readFileSync('../www/plugins.txt', 'utf8');
                const plugins = data.split('\n')
                    .map(l => l.trim())
                    .filter(l => l && !l.startsWith('//'));

                if (plugins.length > 0) {
                    console.log('Installing Plugins: ' + plugins.join(' '));
                    execSync('npm install ' + plugins.join(' '), { stdio: 'inherit' });

                    plugins.forEach((pkg, index) => {
                        const varName = 'Plugin' + index;
                        bridgeContent += `import * as ${varName} from '${pkg}';\n`;
                        bridgeContent += `if (window.Capacitor && window.Capacitor.Plugins) { Object.assign(window.Capacitor.Plugins, ${varName}); }\n`;
                    });
                }
            }
          } catch (err) {
            console.error('Error processing plugins:', err);
            process.exit(1);
          }

          fs.writeFileSync('bridge.js', bridgeContent);
          console.log('Bridge generated successfully.');
          EOF
          
          node generate_bridge.js
          
          echo ">>> Bundling Native Bridge..."
          npx esbuild bridge.js --bundle --minify --outfile=../www/native-bridge.js --format=iife
          
          cd ..
          rm -rf build_env
          
          echo ">>> Injecting Bridge to HTML..."
          if [ -f "www/index.html" ]; then
            sed -i 's|<head>|<head><script src="native-bridge.js"></script>|i' www/index.html
          else
            echo "::error::File www/index.html tidak ditemukan!"
            exit 1
          fi

      - name: Build Android APK
        run: |
          set -e
          
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[BUILD] Syncing Capacitor & Gradle...\"}" "${{ github.event.inputs.logUrl }}"
          
          npm install @capacitor/assets --no-audit
          npx @capacitor/assets generate --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'
          npx cap sync android
          
          cd android
          chmod +x gradlew
          
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[BUILD] Compiling APK (This may take a while)...\"}" "${{ github.event.inputs.logUrl }}"
          
          # Build APK
          ./gradlew assembleDebug --no-daemon

      - name: Release Artifact
        id: create_release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SAFE_APP_NAME=$(echo "${{ github.event.inputs.appName }}" | tr ' ' '_')
          mv android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/${SAFE_APP_NAME}.apk"
          gh release delete build-${{ github.event.inputs.id }} --cleanup-tag -y || true
          gh release create build-${{ github.event.inputs.id }} "android/app/build/outputs/apk/debug/${SAFE_APP_NAME}.apk" --title "${{ github.event.inputs.appName }}" --notes "Auto-generated Build"

      - name: Notify System
        if: always()
        run: |
          STATUS="failed"
          APK_URL=""
          MSG="[ERROR] Build Failed. Check logs."
          SAFE_APP_NAME=$(echo "${{ github.event.inputs.appName }}" | tr ' ' '_')
          
          if [ "${{ job.status }}" == "success" ]; then
             STATUS="success"
             APK_URL="https://github.com/${{ github.repository }}/releases/download/build-${{ github.event.inputs.id }}/${SAFE_APP_NAME}.apk"
             MSG="[SUCCESS] APK Created Successfully."
          fi
          
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"$MSG\"}" "${{ github.event.inputs.logUrl }}"
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"status\": \"$STATUS\", \"apk_url\": \"$APK_URL\"}" "${{ github.event.inputs.webhookUrl }}"
