name: Pro APK Builder
on:
  workflow_dispatch:
    inputs:
      id:
        required: true
        type: string
      appName:
        required: true
        type: string
      packageName:
        required: true
        type: string
      versionCode:
        required: true
        type: string
      versionName:
        required: true
        type: string
      iconUrl:
        required: true
        type: string
      webhookUrl:
        required: true
        type: string
      logUrl:
        required: true
        type: string
      mode:
        required: true
        type: string
      url:
        required: false
        type: string
      projectZip:
        required: false
        type: string
      buildFormat:
        required: false
        type: string
        default: 'apk'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'
      - name: Initialize & Force Stable Dependencies
        run: |
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[SYSTEM] Initializing Repo Engine & Resolving Dependencies...\"}" "${{ github.event.inputs.logUrl }}"
          if [ "${{ github.event.inputs.mode }}" == "code" ]; then
             jq '.appId = "${{ github.event.inputs.packageName }}" | .appName = "${{ github.event.inputs.appName }}" | .webDir = "www" | del(.server.url)' capacitor.config.json > tmp.json && mv tmp.json capacitor.config.json
          else
             jq '.appId = "${{ github.event.inputs.packageName }}" | .appName = "${{ github.event.inputs.appName }}" | .server.url = "${{ github.event.inputs.url }}"' capacitor.config.json > tmp.json && mv tmp.json capacitor.config.json
          fi
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">${{ github.event.inputs.appName }}<\/string>/g' android/app/src/main/res/values/strings.xml
          sed -i 's/versionCode [0-9]*/versionCode ${{ github.event.inputs.versionCode }}/g' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ github.event.inputs.versionName }}"/g' android/app/build.gradle
          sed -i "s/compileSdkVersion = .*/compileSdkVersion = 35/" android/variables.gradle
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = 35/" android/variables.gradle
          sed -i "s/gradle:8.13.0/gradle:8.7.3/" android/build.gradle
          sed -i 's/distributionUrl=.*/distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-8.11.1-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
          cat <<EOF >> android/build.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
                      force 'androidx.activity:activity:1.9.3'
                      force 'androidx.core:core:1.13.1'
                      force 'androidx.core:core-ktx:1.13.1'
                      force 'androidx.core:core-splashscreen:1.0.1'
                  }
              }
          }
          EOF
          mkdir -p assets
          curl -L "${{ github.event.inputs.iconUrl }}" -o assets/icon.png
          cp assets/icon.png assets/splash.png
      - name: Process Source & Plugin Injection
        if: ${{ github.event.inputs.mode == 'code' }}
        run: |
          set -e
          echo "${{ github.event.inputs.projectZip }}" | base64 -d > project.zip
          unzip -o project.zip -d www/
          npm install @capacitor/core @capacitor/android esbuild
          cat << 'EOF' > gen.js
          import fs from 'fs';
          import { execSync } from 'child_process';
          let code = `
          import { Capacitor } from '@capacitor/core';
          window.Capacitor = window.Capacitor || {};
          window.Capacitor.Plugins = window.Capacitor.Plugins || {};
          `;
          if (fs.existsSync('www/plugins.txt')) {
              const plugins = fs.readFileSync('www/plugins.txt', 'utf8').split('\n').map(l => l.trim()).filter(l => l);
              if (plugins.length > 0) {
                  execSync('npm install ' + plugins.join(' '), { stdio: 'inherit' });
                  plugins.forEach((p, i) => {
                      code += `import * as P${i} from '${p}';\nObject.assign(window.Capacitor.Plugins, P${i});\n`;
                  });
              }
          }
          fs.writeFileSync('bridge.js', code);
          EOF
          node gen.js
          npx esbuild bridge.js --bundle --minify --outfile=www/native-bridge.js --format=iife
          sed -i 's|<head>|<head><script src="native-bridge.js"></script>|i' www/index.html
      - name: Compile App
        run: |
          set -e
          npm install @capacitor/assets @capacitor/cli
          npx @capacitor/assets generate --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'
          npx cap sync android
          cd android
          chmod +x gradlew
          if [ "${{ github.event.inputs.buildFormat }}" == "aab" ]; then
              ./gradlew bundleDebug --no-daemon
          else
              ./gradlew assembleDebug --no-daemon
          fi
      - name: Release Artifact
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SAFE_NAME=$(echo "${{ github.event.inputs.appName }}" | tr ' ' '_')
          gh release delete build-${{ github.event.inputs.id }} --cleanup-tag -y || true
          if [ "${{ github.event.inputs.buildFormat }}" == "aab" ]; then
              mv android/app/build/outputs/bundle/debug/app-debug.aab "android/app/build/outputs/bundle/debug/${SAFE_NAME}.aab"
              gh release create build-${{ github.event.inputs.id }} "android/app/build/outputs/bundle/debug/${SAFE_NAME}.aab" --title "${{ github.event.inputs.appName }}"
          else
              mv android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/${SAFE_NAME}.apk"
              gh release create build-${{ github.event.inputs.id }} "android/app/build/outputs/apk/debug/${SAFE_NAME}.apk" --title "${{ github.event.inputs.appName }}"
          fi
      - name: Notify
        if: always()
        run: |
          STATUS="failed"
          APP_URL=""
          if [ "${{ job.status }}" == "success" ]; then
              STATUS="success"
              SAFE_NAME=$(echo "${{ github.event.inputs.appName }}" | tr ' ' '_')
              if [ "${{ github.event.inputs.buildFormat }}" == "aab" ]; then
                  APP_URL="https://github.com/${{ github.repository }}/releases/download/build-${{ github.event.inputs.id }}/${SAFE_NAME}.aab"
              else
                  APP_URL="https://github.com/${{ github.repository }}/releases/download/build-${{ github.event.inputs.id }}/${SAFE_NAME}.apk"
              fi
          fi
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"status\": \"$STATUS\", \"apk_url\": \"$APP_URL\"}" "${{ github.event.inputs.webhookUrl }}"
