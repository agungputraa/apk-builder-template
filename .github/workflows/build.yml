name: App Studio CI

on:
  workflow_dispatch:
    inputs:
      id: { required: true }
      appName: { required: true }
      packageName: { required: true }
      versionCode: { required: true }
      versionName: { required: true }
      iconUrl: { required: true }
      webhookUrl: { required: true }
      logUrl: { required: true }
      mode: { required: true }
      url: { required: false }
      projectZip: { required: false }

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Humanize Activity
        run: |
          git config --global user.name "DevBot"
          git config --global user.email "bot@studio.local"
          
          MSGS=("fix: ui glitch" "chore: update assets" "feat: performance boost" "refactor: core logic" "style: layout adjustment" "fix: minor bug")
          RAND_MSG=${MSGS[$RANDOM % ${#MSGS[@]}]}
          
          echo "Activity: $RAND_MSG" >> activity.log
          git add activity.log
          git commit -m "$RAND_MSG"
          git push

      - name: Notify Init
        run: curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[1/5] Initializing Cloud Runner...\"}" "${{ github.event.inputs.logUrl }}"

      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '21', cache: 'gradle' }

      - name: Configure
        run: |
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[2/5] Configuring Project Environment...\"}" "${{ github.event.inputs.logUrl }}"
          
          if [ "${{ github.event.inputs.mode }}" == "code" ]; then
             jq '.appId = "${{ github.event.inputs.packageName }}" | .appName = "${{ github.event.inputs.appName }}" | .webDir = "www" | del(.server.url)' capacitor.config.json > tmp.json && mv tmp.json capacitor.config.json
          else
             jq '.appId = "${{ github.event.inputs.packageName }}" | .appName = "${{ github.event.inputs.appName }}" | .server.url = "${{ github.event.inputs.url }}"' capacitor.config.json > tmp.json && mv tmp.json capacitor.config.json
          fi

          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">${{ github.event.inputs.appName }}<\/string>/g' android/app/src/main/res/values/strings.xml
          sed -i 's/versionCode [0-9]*/versionCode ${{ github.event.inputs.versionCode }}/g' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ github.event.inputs.versionName }}"/g' android/app/build.gradle

      - name: Prepare Assets
        run: |
          if [ "${{ github.event.inputs.mode }}" == "code" ]; then
             echo "${{ github.event.inputs.projectZip }}" | base64 -d > project.zip
             mkdir -p www
             unzip -o -q project.zip -d www/
          fi

          mkdir -p assets
          curl -s -L "${{ github.event.inputs.iconUrl }}" -o assets/icon.png
          cp assets/icon.png assets/splash.png
          
          npm ci --silent
          npm install @capacitor/assets --silent
          npx @capacitor/assets generate --iconBackgroundColor #ffffff --splashBackgroundColor #ffffff
          npx cap sync android

      - name: Compile
        run: |
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[3/5] Compiling APK (Gradle)...\"}" "${{ github.event.inputs.logUrl }}"
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --parallel --no-daemon --quiet

      - name: Release
        id: create_release
        if: success()
        run: |
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[4/5] Signing & Uploading...\"}" "${{ github.event.inputs.logUrl }}"
          gh release create build-${{ github.event.inputs.id }} android/app/build/outputs/apk/debug/app-debug.apk --title "${{ github.event.inputs.appName }}" --notes "Version ${{ github.event.inputs.versionName }}"

      - name: Finalize
        if: always()
        run: |
          STATUS="failed"
          APK_URL=""
          MSG="[ERROR] Build Process Failed."
          
          if [ "${{ job.status }}" == "success" ]; then
             STATUS="success"
             APK_URL="https://github.com/${{ github.repository }}/releases/download/build-${{ github.event.inputs.id }}/app-debug.apk"
             MSG="[5/5] SUCCESS! APK Ready for Download."
          fi
          
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"$MSG\"}" "${{ github.event.inputs.logUrl }}"
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"status\": \"$STATUS\", \"apk_url\": \"$APK_URL\"}" "${{ github.event.inputs.webhookUrl }}"
