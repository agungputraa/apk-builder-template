name: Pro APK Builder

on:
  workflow_dispatch:
    inputs:
      id: { required: true, type: string }
      appName: { required: true, type: string }
      packageName: { required: true, type: string }
      versionCode: { required: true, type: string }
      versionName: { required: true, type: string }
      iconUrl: { required: true, type: string }
      webhookUrl: { required: true, type: string }
      logUrl: { required: true, type: string }
      mode: { required: true, type: string }
      url: { required: false, type: string }
      projectZip: { required: false, type: string }

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Initialize & Stabilize
        run: |
          # Setup Capacitor Config
          if [ "${{ github.event.inputs.mode }}" == "code" ]; then
             jq '.appId = "${{ github.event.inputs.packageName }}" | .appName = "${{ github.event.inputs.appName }}" | .webDir = "www" | del(.server.url)' capacitor.config.json > tmp.json && mv tmp.json capacitor.config.json
          else
             jq '.appId = "${{ github.event.inputs.packageName }}" | .appName = "${{ github.event.inputs.appName }}" | .server.url = "${{ github.event.inputs.url }}"' capacitor.config.json > tmp.json && mv tmp.json capacitor.config.json
          fi

          # Fix Versions
          sed -i "s/compileSdkVersion = .*/compileSdkVersion = 35/" android/variables.gradle
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = 35/" android/variables.gradle
          sed -i "s/gradle:8.13.0/gradle:8.7.3/" android/build.gradle
          sed -i 's/distributionUrl=.*/distributionUrl=https\\:\/\/services.gradle.org\/distributions\/gradle-8.11.1-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties

      - name: Prepare Source & Build Native Bridge
        run: |
          set -e
          # Jika mode code, extract zip. Jika tidak, gunakan file dari repo
          if [ "${{ github.event.inputs.mode }}" == "code" ]; then
             echo "${{ github.event.inputs.projectZip }}" | base64 -d > project.zip
             unzip -o project.zip -d www/
          fi
          
          mkdir -p build_env && cd build_env
          echo '{"type":"module","dependencies":{"@capacitor/core":"latest","@capacitor/android":"latest","esbuild":"latest"}}' > package.json
          npm install
          
          # Buat Bridge yang memaksa isNative = true agar logic Anda jalan
          cat << 'EOF' > generate_bridge.js
          import fs from 'fs';
          import { execSync } from 'child_process';
          let bridge = "import { Capacitor } from '@capacitor/core';\n";
          bridge += "window.Capacitor = Capacitor;\n";
          bridge += "window.Capacitor.isNative = true;\n"; // PAKSA TRUE
          bridge += "window.Capacitor.Plugins = window.Capacitor.Plugins || {};\n";

          if (fs.existsSync('../www/plugins.txt')) {
              const plugins = fs.readFileSync('../www/plugins.txt', 'utf8').split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('//'));
              if (plugins.length > 0) {
                  execSync('npm install ' + plugins.join(' '), { stdio: 'inherit' });
                  plugins.forEach((pkg, i) => {
                      const name = pkg.split('/').pop().replace(/-/g, '_');
                      bridge += `import * as P${i} from '${pkg}';\nObject.assign(window.Capacitor.Plugins, P${i});\n`;
                  });
              }
          }
          fs.writeFileSync('bridge.js', bridge);
          EOF
          
          node generate_bridge.js
          npx esbuild bridge.js --bundle --minify --outfile=../www/native-bridge.js --format=iife
          cd ..
          
          # Inject script ke index.html paling atas
          sed -i 's|<head>|<head><script src="native-bridge.js"></script>|i' www/index.html

      - name: Build Android APK
        run: |
          npm install @capacitor/assets --no-audit
          npx @capacitor/assets generate --iconBackgroundColor '#ffffff'
          npx cap sync android
          cd android && chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Release & Notify
        env: { GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        run: |
          SAFE_NAME=$(echo "${{ github.event.inputs.appName }}" | tr ' ' '_')
          mv android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/${SAFE_NAME}.apk"
          gh release create build-${{ github.event.inputs.id }} "android/app/build/outputs/apk/debug/${SAFE_NAME}.apk" --title "${{ github.event.inputs.appName }}"
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"status\": \"success\", \"apk_url\": \"https://github.com/${{ github.repository }}/releases/download/build-${{ github.event.inputs.id }}/${SAFE_NAME}.apk\"}" "${{ github.event.inputs.webhookUrl }}"
