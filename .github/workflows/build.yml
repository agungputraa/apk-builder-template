name: Pro APK Builder

on:
  workflow_dispatch:
    inputs:
      id:
        required: true
        type: string
      appName:
        required: true
        type: string
      packageName:
        required: true
        type: string
      versionCode:
        required: true
        type: string
      versionName:
        required: true
        type: string
      iconUrl:
        required: true
        type: string
      webhookUrl:
        required: true
        type: string
      logUrl:
        required: true
        type: string
      mode:
        required: true
        type: string
      url:
        required: false
        type: string
      projectZip:
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Initialize Environment
        run: |
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[SYSTEM] Initializing Hybrid Engine...\"}" "${{ github.event.inputs.logUrl }}"
          
          # Setup Capacitor Config
          if [ "${{ github.event.inputs.mode }}" == "code" ]; then
             jq '.appId = "${{ github.event.inputs.packageName }}" | .appName = "${{ github.event.inputs.appName }}" | .webDir = "www" | del(.server.url)' capacitor.config.json > tmp.json && mv tmp.json capacitor.config.json
          else
             jq '.appId = "${{ github.event.inputs.packageName }}" | .appName = "${{ github.event.inputs.appName }}" | .server.url = "${{ github.event.inputs.url }}"' capacitor.config.json > tmp.json && mv tmp.json capacitor.config.json
          fi

          # Update Android Resources
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">${{ github.event.inputs.appName }}<\/string>/g' android/app/src/main/res/values/strings.xml
          sed -i 's/versionCode [0-9]*/versionCode ${{ github.event.inputs.versionCode }}/g' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "${{ github.event.inputs.versionName }}"/g' android/app/build.gradle
          
          mkdir -p assets
          curl -L "${{ github.event.inputs.iconUrl }}" -o assets/icon.png
          cp assets/icon.png assets/splash.png

      - name: Process Source (Native Bridge)
        if: ${{ github.event.inputs.mode == 'code' }}
        run: |
          # 1. Decode & Unzip
          echo "${{ github.event.inputs.projectZip }}" | base64 -d > project.zip
          mkdir -p www
          unzip -o project.zip -d www/
          
          # 2. Buat package.json minimal
          # Tambahkan type: module agar import/export JS modern berjalan lancar
          cat << 'EOF' > package.json
          {
            "name": "apk-builder",
            "type": "module", 
            "dependencies": {
              "@capacitor/core": "latest",
              "@capacitor/android": "latest",
              "esbuild": "latest"
            }
          }
          EOF

          # 3. Buat Script Bridge (Jembatan)
          echo "import { Capacitor, Plugins } from '@capacitor/core';" > cap-bridge.js
          echo "window.Capacitor = Capacitor;" >> cap-bridge.js
          echo "window.Capacitor.Plugins = Plugins;" >> cap-bridge.js
          
          # 4. Install Plugin dari plugins.txt (Jika ada)
          if [ -s "www/plugins.txt" ]; then
            PLUGINS=$(cat www/plugins.txt | grep -v '^//' | tr '\n' ' ' | tr -d '\r' | xargs)
            if [ -n "$PLUGINS" ]; then
              curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[NPM] Installing Plugins: $PLUGINS\"}" "${{ github.event.inputs.logUrl }}"
              npm install $PLUGINS --save --no-audit --prefer-offline
              
              counter=0
              while read -r plugin; do
                [[ $plugin = //* ]] && continue
                [[ -z $plugin ]] && continue
                safe_name=$(echo "$plugin" | sed -e 's/[^a-zA-Z0-9]/_/g')
                echo "import * as Plugin$counter from '$plugin';" >> cap-bridge.js
                echo "if(window.Capacitor.Plugins) { Object.assign(window.Capacitor.Plugins, Plugin$counter); }" >> cap-bridge.js
                ((counter++))
              done < www/plugins.txt
            fi
          fi

          # 5. Install Dependencies (Silent)
          npm install --no-audit --prefer-offline --legacy-peer-deps

          # 6. Bundle Bridge menggunakan NPX ESBUILD (Perbaikan Utama)
          # Menggunakan npx lebih aman daripada path hardcoded
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[BUILD] Bundling Native Bridge...\"}" "${{ github.event.inputs.logUrl }}"
          npx esbuild cap-bridge.js --bundle --minify --outfile=www/native-bridge.js

          # 7. Inject Script ke HTML
          # Memastikan file index.html ada sebelum diedit
          if [ -f "www/index.html" ]; then
            sed -i 's|<head>|<head><script src="native-bridge.js"></script>|i' www/index.html
          else
            echo "Warning: index.html not found in www/"
          fi

      - name: Sync & Compile APK
        run: |
          npm install @capacitor/assets --no-audit --prefer-offline
          npx @capacitor/assets generate
          npx cap sync android
          
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"[BUILD] Compiling Android (Gradle)...\"}" "${{ github.event.inputs.logUrl }}"
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --parallel --no-daemon --quiet

      - name: Release Artifact
        id: create_release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SAFE_APP_NAME=$(echo "${{ github.event.inputs.appName }}" | tr ' ' '_')
          mv android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/${SAFE_APP_NAME}.apk"
          gh release delete build-${{ github.event.inputs.id }} --cleanup-tag -y || true
          gh release create build-${{ github.event.inputs.id }} "android/app/build/outputs/apk/debug/${SAFE_APP_NAME}.apk" --title "${{ github.event.inputs.appName }}" --notes "Built via App Studio"

      - name: Notify System
        if: always()
        run: |
          STATUS="failed"
          APK_URL=""
          MSG="[ERROR] Build process failed."
          SAFE_APP_NAME=$(echo "${{ github.event.inputs.appName }}" | tr ' ' '_')
          
          if [ "${{ job.status }}" == "success" ]; then
             STATUS="success"
             APK_URL="https://github.com/${{ github.repository }}/releases/download/build-${{ github.event.inputs.id }}/${SAFE_APP_NAME}.apk"
             MSG="[SUCCESS] APK Ready for Download."
          fi
          
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"log\": \"$MSG\"}" "${{ github.event.inputs.logUrl }}"
          curl -X POST -H "Content-Type: application/json" -d "{\"id\": \"${{ github.event.inputs.id }}\", \"status\": \"$STATUS\", \"apk_url\": \"$APK_URL\"}" "${{ github.event.inputs.webhookUrl }}"
